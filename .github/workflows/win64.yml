name: Win64 Setup

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: win64-setup
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      VUE_APP_NETEASE_API_URL: /api
      VUE_APP_ELECTRON_API_URL: /api
      VUE_APP_ELECTRON_API_URL_DEV: http://127.0.0.1:10754
      VUE_APP_LASTFM_API_KEY: 09c55292403d961aa517ff7f5e8a3d9c
      VUE_APP_LASTFM_API_SHARED_SECRET: 307c9fda32b3904e53654baff215cb67

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --ignore-engines --non-interactive

      - name: Verify Windows native dependencies
        run: |
          node -e "require('@unblockneteasemusic/rust-napi'); require('esbuild').transformSync('const x = 1')"

      - name: Verify renderer startup imports
        run: |
          node --experimental-vm-modules scripts/test-startup-imports.mjs
          node scripts/test-library-cache.cjs

      - name: Build Windows x64 Setup
        run: yarn electron:build-win64

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-win64-Setup
          path: dist_electron/YesPlayMusic-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Check out artifact branch
        uses: actions/checkout@v4
        with:
          ref: win64
          path: win64-artifacts
        env:
          GIT_LFS_SKIP_SMUDGE: '1'

      - name: Publish installer to win64
        run: node .github/scripts/publish-win64.cjs
        env:
          WIN64_ARTIFACT_BRANCH_PATH: win64-artifacts
          WIN64_SOURCE_SHA: ${{ github.sha }}
          WIN64_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
