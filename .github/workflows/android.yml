name: Android Tablet APK

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'scripts/*android-api*'
      - 'scripts/check-android-packages.py'
      - 'scripts/test-tracking.cjs'
      - 'scripts/test-library-archive.cjs'
      - 'scripts/test-retained-tracks.cjs'
      - 'scripts/test-home-sections.cjs'
      - 'scripts/test-discovery-cache.cjs'
      - 'scripts/test-playlist-recommendations.cjs'
      - 'scripts/test-player-options.cjs'
      - 'scripts/test-appearance.cjs'
      - 'scripts/test-android-startup.cjs'
      - 'src/**'
      - 'public/**'
      - '.env.android'
      - 'package.json'
      - 'yarn.lock'
      - 'vue.config.js'
      - 'babel.config.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      device_tests:
        description: 'Run Android emulator API, media and UI tests'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-tablet-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      ELECTRON_OVERRIDE_DIST_PATH: /tmp/unused-electron
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn
      - name: Install web build dependencies
        run: yarn install --frozen-lockfile --ignore-engines --ignore-scripts --non-interactive
      - name: Verify UI state, navigation and API readiness
        run: |
          node scripts/test-appearance.cjs
          node scripts/test-player-options.cjs
          node scripts/test-home-sections.cjs
          node scripts/test-discovery-cache.cjs
          node scripts/test-playlist-recommendations.cjs
          node scripts/test-tracking.cjs
          node scripts/test-library-archive.cjs
          node scripts/test-retained-tracks.cjs
          node scripts/test-android-startup.cjs
      - name: Build tablet interface
        run: yarn android:web
      - name: Bundle local music API
        run: yarn android:api
      - name: Test Android requests and bundled API startup
        run: yarn android:test
      - name: Download embedded Node.js runtime
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/nodejs-mobile.zip" https://github.com/fogtape/nodejs-mobile/releases/download/v24.21.0-0/nodejs-mobile-android-24.21.0-0.zip
          echo "e3cd29a1be03405f11dd5c857af8cd3ad13f84f1409ea648f5328f0bada5bd76  $RUNNER_TEMP/nodejs-mobile.zip" | sha256sum --check
          mkdir -p android/app/libnode
          unzip -q "$RUNNER_TEMP/nodejs-mobile.zip" -d android/app/libnode
      - name: Bundle interface assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -a dist/. android/app/src/main/assets/web/
          base64 --decode android/development-keystore.base64 > android/dev-keystore.p12
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Verify packaged API files
        run: python3 scripts/check-android-api-assets.py android/app/build/outputs/apk/release/app-release.apk
      - name: Enable Android emulator acceleration
        if: github.event_name == 'workflow_dispatch' && inputs.device_tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify embedded API on Android 15
        if: github.event_name == 'workflow_dispatch' && inputs.device_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash scripts/smoke-android-api.sh
            gradle -p android connectedDebugAndroidTest --no-daemon || { cat android/app/build/outputs/androidTest-results/connected/debug/TEST-*.xml; adb pull /sdcard/Android/data/com.luna.music/files/android-ui android-ui-report || true; exit 1; }
            adb pull /sdcard/Android/data/com.luna.music/files/android-ui android-ui-report
            adb shell dumpsys media_session > android-ui-report/media-session.txt
      - name: Save Android UI verification
        if: always() && github.event_name == 'workflow_dispatch' && inputs.device_tests
        uses: actions/upload-artifact@v4
        with:
          name: Android-UI-verification
          path: android-ui-report/
          if-no-files-found: warn
      - name: Prepare installer
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk YesPlayMusic-Android-Tablet.apk
          sha256sum YesPlayMusic-Android-Tablet.apk > YesPlayMusic-Android-Tablet.apk.sha256
      - name: Verify package identity, media entry points and signing certificate
        run: python3 scripts/check-android-packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-Android-Tablet
          path: |
            YesPlayMusic-Android-Tablet.apk
            YesPlayMusic-Android-Tablet.apk.sha256
          if-no-files-found: error
      - name: Publish APK to android branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-artifact"
          cd "$RUNNER_TEMP/android-artifact"
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if git ls-remote --exit-code origin refs/heads/android >/dev/null 2>&1; then
            git fetch --depth=1 origin android
            git checkout -B android FETCH_HEAD
          else
            git checkout --orphan android
          fi
          cp "$GITHUB_WORKSPACE/YesPlayMusic-Android-Tablet.apk" .
          cp "$GITHUB_WORKSPACE/YesPlayMusic-Android-Tablet.apk.sha256" .
          rm -f YesPlayMusic-Android-HarmonyOS.apk YesPlayMusic-Android-HarmonyOS.apk.sha256
          cp "$GITHUB_WORKSPACE/android/HARMONYOS.md" HARMONYOS.md
          cp "$GITHUB_WORKSPACE/android/INSTALL.md" README.md
          if [ -d "$GITHUB_WORKSPACE/android-ui-report" ]; then
            rm -rf ui-verification
            cp -a "$GITHUB_WORKSPACE/android-ui-report" ui-verification
          else
            rm -rf ui-verification
          fi
          printf '{"sourceSha":"%s","runUrl":"https://github.com/%s/actions/runs/%s"}\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > build-info.json
          git add .
          git commit -m "build(android): ${GITHUB_SHA:0:12}"
          git push origin HEAD:android
