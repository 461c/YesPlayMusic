<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <style>html { background: #fff; } @media (prefers-color-scheme: dark) { html { background: #000; } }</style>
  <script>
    try {
      var appearance = JSON.parse(localStorage.getItem('settings') || '{}').appearance || 'auto';
      var systemDark = window.YesPlayMusicAndroid ? window.YesPlayMusicAndroid.isSystemDark() : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.style.backgroundColor = appearance === 'dark' || (appearance === 'auto' && systemDark) ? '#000' : '#fff';
    } catch (_) {}
  </script>
  <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
  <title>
    <%= htmlWebpackPlugin.options.title %>
  </title>
</head>

<body>
  <noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work
        properly without JavaScript enabled. Please enable it to
        continue.</strong>
  </noscript>
  <div id="app"></div>
  <!-- built files will be auto injected -->
</body>

</html>
