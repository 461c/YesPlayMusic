plugins { id 'com.android.application' }

android {
    namespace 'com.yesplaymusic.tablet'
    compileSdk 35
    defaultConfig {
        applicationId 'com.yesplaymusic.tablet'
        minSdk 24
        targetSdk 35
        versionCode 41109
        versionName '0.4.11-android.9'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++20'; arguments '-DANDROID_STL=c++_shared' } }
    }
    ndkVersion '27.3.13750724'
    externalNativeBuild { cmake { path file('CMakeLists.txt'); version '3.22.1' } }
    // Node packages have legitimate underscore paths; package exactly the manifest's files.
    androidResources { ignoreAssetsPattern = '' }
    packaging { jniLibs { useLegacyPackaging true } }
    testBuildType 'debug'
    signingConfigs {
        development {
            storeFile file('../dev-keystore.p12')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.development }
        release {
            signingConfig signingConfigs.development
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.media3:media3-database:1.5.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
